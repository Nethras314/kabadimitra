name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (syntax + import graph)
        run: |
          python -m compileall -q app
          python -c "import app.main"

      # Unit tests that do not need a database. The full suite requires a live
      # Supabase instance and runs separately (see the integration job).
      - name: Unit tests (no database)
        run: python -m pytest tests/unit -q -p no:cacheprovider

      - name: Migrations are valid SQL
        working-directory: .
        run: |
          npm --prefix backend/migrations install
          node -e "
            const fs=require('fs'),p='backend/migrations';
            const files=fs.readdirSync(p).filter(f=>f.endsWith('.sql')).sort();
            if(!files.length) throw new Error('no migrations found');
            console.log(files.length+' migration files present');
          "

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  mobile:
    name: Mobile (Expo) typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Typecheck
        run: npx tsc --noEmit

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (high/critical only)
        continue-on-error: true
        run: |
          npm --prefix web audit --audit-level=high || true
          npm --prefix mobile audit --audit-level=high || true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
